# Local-only Postgres for the cluster demo. Ephemeral storage (emptyDir): data does not survive a
# pod restart, which is fine for a prototype. A real cluster uses a managed database or a
# StatefulSet with a PersistentVolumeClaim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: clinical-ai
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: clinicalai
            - name: POSTGRES_USER
              value: clinicalai
            - name: POSTGRES_PASSWORD
              value: clinicalai
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "clinicalai"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: clinical-ai
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
