spring:
  application:
    name: clinical-ai-gateway

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinicalai}
    username: ${DB_USER:clinicalai}
    password: ${DB_PASSWORD:clinicalai}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: clinical-ai-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.clinicalai.gateway.service.audit.AuditEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/app.pub

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  usage:
    # monitor: record usage and log soft budget crossings without blocking (default).
    # enforce: reject requests once the per tenant budget is crossed.
    mode: ${USAGE_MODE:monitor}
    requests-per-minute: ${USAGE_RPM:600}
  governance:
    # Empty means autonomy for every assistant. Set a risk based list, for example CLINICAL,BILLING,
    # to require human review for those flows while the rest stay autonomous.
    review-required-assistants: ${REVIEW_REQUIRED_ASSISTANTS:}
  model:
    provider: ${MODEL_PROVIDER:mock}
  kafka:
    audit-topic: ${AUDIT_TOPIC:clinical-ai.audit}

logging:
  level:
    com.clinicalai.gateway: INFO
